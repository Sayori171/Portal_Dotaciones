@switch (productId()) {
  @case ('camisa') {
    <svg viewBox="0 0 220 220" [attr.width]="190 * scale()" [attr.height]="190 * scale()" aria-hidden="true">
      <path d="M60 30 L90 15 L110 30 L130 15 L160 30 L175 55 L155 70 L150 60 L150 190 L70 190 L70 60 L65 70 L45 55 Z"
            fill="#2C4A6E" stroke="#7FA2C4" stroke-width="2" />
      <!-- zona estampado: pecho -->
      <rect class="garment-zone" [class]="zoneClass('print')" x="92" y="80" width="36" height="36" rx="4" fill="#7FA2C4" opacity=".25" />
      <!-- zona bordado: bolsillo -->
      <rect class="garment-zone" [class]="zoneClass('embroidery')" x="78" y="72" width="16" height="14" rx="2" fill="#7FA2C4" opacity=".25" />
      <!-- zona cinta reflectiva: mangas -->
      <rect class="garment-zone" [class]="zoneClass('tapeL')" x="48" y="55" width="10" height="30" rx="2" fill="#7FA2C4" opacity=".25" />
      <rect class="garment-zone" [class]="zoneClass('tapeR')" x="162" y="55" width="10" height="30" rx="2" fill="#7FA2C4" opacity=".25" />
      <line x1="110" y1="30" x2="110" y2="190" stroke="#7FA2C4" stroke-width="1" opacity=".4" />
    </svg>
  }
  @case ('pantalon') {
    <svg viewBox="0 0 220 220" [attr.width]="170 * scale()" [attr.height]="190 * scale()" aria-hidden="true">
      <path d="M75 20 L145 20 L150 100 L165 195 L135 195 L118 110 L110 110 L98 195 L68 195 L75 100 Z"
            fill="#2C4A6E" stroke="#7FA2C4" stroke-width="2" />
      <line x1="110" y1="20" x2="110" y2="105" stroke="#7FA2C4" stroke-width="1" opacity=".4" />
      <!-- zona cinta reflectiva: bota -->
      <rect class="garment-zone" [class]="zoneClass('tapeL')" x="70" y="180" width="26" height="12" rx="2" fill="#7FA2C4" opacity=".25" />
      <rect class="garment-zone" [class]="zoneClass('tapeR')" x="137" y="180" width="26" height="12" rx="2" fill="#7FA2C4" opacity=".25" />
    </svg>
  }
}
