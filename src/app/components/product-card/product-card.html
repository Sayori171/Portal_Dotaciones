<article class="product-card">
  <div class="product-visual">
    <span class="price-tab">Desde {{ product().basePrice | cop }}</span>
    <app-garment-svg [productId]="product().id" />
  </div>
  <div class="product-body">
    <div class="product-title">
      <h3>{{ product().name }}</h3>
      <span class="base-price">{{ product().basePrice | cop }}</span>
    </div>
    <p class="product-desc">{{ product().description }}</p>

    <div class="meta">
      <span class="meta-label">Tallas</span>
      <span class="meta-value">{{ product().sizes.join(' · ') }}</span>
    </div>
    <ul class="addon-list">
      @for (addon of product().addons; track addon.id) {
        <li><span>{{ addon.name }}</span><span class="price">+{{ addon.price | cop }}</span></li>
      }
    </ul>

    <a class="btn-add" [routerLink]="['/producto', product().id]">Personalizar y cotizar</a>
  </div>
</article>
